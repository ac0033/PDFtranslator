schema_version = "1.0"
run_id = "opt-slice-r1"
provider = "deepseek"
model_id = "deepseek-flash"
source_lang = "en"
target_lang = "zh-CN"
style_revision = "v0.7-default-style"
prompt_revision = "v0.7-complete-term-lock"
adapter_revision = "babeldoc-0.6.4-usable-v1"
pricing_revision = "deepseek-official-2026-09-15-peak-ceiling"
max_output_tokens = 2000
# 120 pages of a 634-page book. val.pdf cost 1.47 USD for 442 pages, so this
# should land near 0.4; the ceiling is set well above it so a surprise stops
# the run rather than quietly spending more.
budget_usd = 1.50
input_usd_per_million = 0.30
output_usd_per_million = 1.20
context_token_budget = 8000
api_key_env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com"
reasoning_effort = "none"
provider_max_attempts = 3
output_token_policy = "adaptive-v1"
context_engine = "v1"
# A separate context store: this is a different book, and reusing val's
# terminology would smuggle one document's decisions into another's test.
context_db = "runs/opt-slice/context.sqlite"
