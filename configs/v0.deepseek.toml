# DeepSeek-V4.1-Flash uses the official API model ID "deepseek-flash".
# Prices below are the documented peak rates on 2026-09-10 and are used as
# conservative reservation rates. Recheck pricing before a large run.
schema_version = "1.0"
run_id = "deepseek-v0-smoke"
provider = "deepseek"
model_id = "deepseek-flash"
source_lang = "en"
target_lang = "zh-CN"
style_revision = "v0-natural-textbook-zh"
prompt_revision = "v0.1"
adapter_revision = "deepseek-responses-v0.1"
pricing_revision = "deepseek-2026-09-10-peak"
max_output_tokens = 2000
# 1.5 CNY / 6.7766 CNY per USD = about 0.221 USD on 2026-09-10.
# Rounded down to 0.20 USD so the configured hard limit stays below 1.5 CNY.
budget_usd = 0.20
input_usd_per_million = 0.30
output_usd_per_million = 1.20
context_token_budget = 600
api_key_env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com"
reasoning_effort = "none"
