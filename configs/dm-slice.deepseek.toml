schema_version = "1.0"
run_id = "dm-slice-r1"
provider = "deepseek"
model_id = "deepseek-flash"
source_lang = "en"
target_lang = "zh-CN"
style_revision = "v0.7-default-style"
prompt_revision = "v0.7-complete-term-lock"
adapter_revision = "babeldoc-0.6.4-usable-v1"
pricing_revision = "deepseek-official-2026-09-15-peak-ceiling"
max_output_tokens = 2000
# 120 pages of a 700-page book, 37068 body words - roughly twice the density of
# the optimization.pdf slice, which estimated 1.16 and actually spent 0.46. So
# expect a ceiling near 2.3 and a real cost near 0.9. The ceiling is what the
# pre-flight compares against, and a run that never starts is its own failure,
# so this sits above it with room while still stopping a genuine surprise.
budget_usd = 3.00
input_usd_per_million = 0.30
output_usd_per_million = 1.20
context_token_budget = 8000
api_key_env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com"
reasoning_effort = "none"
provider_max_attempts = 3
output_token_policy = "adaptive-v1"
context_engine = "v1"
# A separate context store per book: reusing another document's terminology
# would smuggle its decisions into this one's test.
context_db = "runs/dm-slice/context.sqlite"
