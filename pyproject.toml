[project]
name = "pdf-translation"
version = "0.9.0"
description = "Auditable, budget-gated PDF translation runtime"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "babeldoc==0.6.4",
  "httpx>=0.27",
  "openai>=2.0.0",
  "psutil>=5.9",
  "pydantic>=2.10.0",
  "pymupdf>=1.25.0",
  "python-dotenv>=1.1.0",
  "typer>=0.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
pdftrans = "pdf_translation.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_translation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
